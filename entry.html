<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="style.css">
<link rel="alternate" type="application/rss+xml" title="field/notes" href="https://tmcastillon01.github.io/PhotoPortfolio/feed.xml">
</head>
<body>

<div class="grain"></div>

<header>
  <div class="wrap">
    <nav>
      <a href="index.html" class="wordmark">field<span class="accent">/</span>notes <span class="by">by</span> <span class="accent">Timothy Castillon</span></a>
      <div class="navlinks">
        <a href="index.html#journal">Journal</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
        <a href="projects.html">Projects</a>
      </div>
    </nav>
  </div>
</header>

<div class="wrap">
  <div class="entry-page-head">
    <a class="back-link" href="index.html#journal">&larr; Back to the Journal</a>
    <div id="entry-root">Loading…</div>
  </div>
</div>

<footer>
  <div class="wrap footer-grid">
    <div>
      <div class="wordmark">field<span class="accent">/</span>notes</div>
      <p class="footer-note">Updated after every trip. Prints and licensing available on request.</p>
      <p class="footer-copyright">© Timothy Castillon 2026</p>
    </div>
    <div class="subscribe" data-subscribe="footer"></div>
  </div>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <div class="lightbox-count" id="lightbox-count"></div>
  <button type="button" class="lightbox-close" id="lightbox-close">Close ✕</button>
  <button type="button" class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Previous photo">&larr;</button>
  <div class="lightbox-frame">
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>
  <button type="button" class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Next photo">&rarr;</button>
</div>

<div class="map-modal" id="map-modal" role="dialog" aria-modal="true" aria-label="Location map">
  <div class="map-panel">
    <div class="map-bar">
      <span class="map-bar-title" id="map-title"></span>
      <button type="button" class="map-close" id="map-close">[ X ] Close</button>
    </div>
    <div class="map-canvas" id="map-canvas"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="lightbox.js"></script>
<script src="subscribe.js"></script>
<script src="entries.js"></script>
<script>
  // "16.58°N 120.70°E" -> { lat: 16.58, lng: 120.70 }. Returns null if the
  // text doesn't match, so a malformed coords string never breaks the page.
  function parseCoords(str) {
    const m = /^\s*(\d+(?:\.\d+)?)\s*°\s*([NS])\s+(\d+(?:\.\d+)?)\s*°\s*([EW])\s*$/i.exec(str || '');
    if (!m) return null;
    const lat = parseFloat(m[1]) * (m[2].toUpperCase() === 'S' ? -1 : 1);
    const lng = parseFloat(m[3]) * (m[4].toUpperCase() === 'W' ? -1 : 1);
    if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return { lat, lng };
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  function setupMap(entry) {
    const btn = document.querySelector('[data-open-map]');
    const pos = parseCoords(entry.coords);
    if (!btn || !pos) return;
    const modal = document.getElementById('map-modal');
    const canvas = document.getElementById('map-canvas');
    const closeBtn = document.getElementById('map-close');
    document.getElementById('map-title').textContent = entry.location || '';
    let map = null;

    function openMap() {
      modal.classList.add('open');
      document.body.classList.add('map-open');
      closeBtn.focus();
      if (typeof L === 'undefined') {
        canvas.innerHTML = '<div class="map-fallback">The map could not load. Check your connection and try again.</div>';
        return;
      }
      if (!map) {
        map = L.map(canvas, { center: [pos.lat, pos.lng], zoom: 9, minZoom: 3, scrollWheelZoom: false, worldCopyJump: true });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: 'abcd',
          maxZoom: 19
        }).addTo(map);
        const icon = L.divIcon({ className: 'map-marker', html: '<span></span>', iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -14] });
        L.marker([pos.lat, pos.lng], { icon, title: entry.location, keyboard: false })
          .addTo(map)
          .bindPopup(`<div class="map-pop-loc">${esc(entry.location)}</div><div class="map-pop-co">${esc(entry.coords)}</div>`, { closeButton: false, autoPan: false })
          .openPopup();
        // Wheel zoom stays off until the reader clicks the map, so scrolling
        // the page never gets trapped inside it.
        map.on('click', () => map.scrollWheelZoom.enable());
        map.on('mouseout', () => map.scrollWheelZoom.disable());
      }
      setTimeout(() => { map.invalidateSize(); map.setView([pos.lat, pos.lng], map.getZoom()); }, 50);
    }

    function closeMap() {
      modal.classList.remove('open');
      document.body.classList.remove('map-open');
      btn.focus();
    }

    btn.addEventListener('click', openMap);
    closeBtn.addEventListener('click', closeMap);
    modal.addEventListener('click', (e) => { if (e.target === modal) closeMap(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.classList.contains('open')) closeMap(); });
  }

  function renderEntry() {
    if (typeof ENTRIES === 'undefined' || !Array.isArray(ENTRIES)) {
      throw new Error('ENTRIES is missing or invalid -- check entries.js for a syntax error.');
    }
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const entry = ENTRIES.find(e => e.slug === slug);
    const root = document.getElementById('entry-root');

    if (!entry) {
      root.innerHTML = `<p style="color:var(--ink-muted); font-family:'IBM Plex Mono',monospace; font-size:14px;">
        No entry found for "${slug || ''}". <a href="index.html#journal" style="color:var(--gold);">Back to the journal.</a></p>`;
      return;
    }

    document.getElementById('page-title').textContent = `${entry.title} — Notes From the Field`;

    const frames = Array.from({ length: entry.count }, (_, i) => {
      const n = String(i + 1).padStart(2, '0');
      const cap = (entry.captions && entry.captions[i]) ? entry.captions[i] : '';
      return `<div class="frame" data-frame="${entry.slug.toUpperCase().slice(0,3)}-${n}" data-caption="${cap.replace(/"/g, '&quot;')}" tabindex="0">
                <img src="images/${entry.slug}/${n}.jpg" alt="${entry.title}, frame ${n}" loading="lazy">
              </div>`;
    }).join('');

    const dataCardHtml = (entry.dataPoints && entry.dataPoints.length) ? `
      <div class="data-card">
        <div class="data-label">[ Field Data ]</div>
        ${entry.dataPoints.map(([k, v]) => `<div class="data-row"><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}
        ${entry.dataNote ? `<div class="data-note">${entry.dataNote}</div>` : ''}
      </div>` : '';

    const sourcesHtml = (entry.sources && entry.sources.length) ? `
      <div class="sources-line"><span>Sources:</span> ${entry.sources.join(' &nbsp;\u2022&nbsp; ')}</div>` : '';

    const coordsHtml = parseCoords(entry.coords)
      ? `<button type="button" class="coords-link" data-open-map aria-label="Show ${esc(entry.coords)} on a map">${esc(entry.coords)} &nearr;</button>`
      : `<span class="loc">${entry.coords}</span>`;

    root.innerHTML = `
      <div class="entry-head">
        <div class="entry-col-meta">
          <div class="entry-meta" style="padding-top:0;">
            ${entry.date}
            ${coordsHtml}
            <span class="loc">${entry.location}</span>
          </div>
          ${dataCardHtml}
          ${sourcesHtml}
        </div>
        <div class="entry-col-main">
          <h1 class="entry-title">${entry.title}</h1>
          <p class="entry-desc">${entry.description}</p>
          <div class="card-tags" style="margin-top:18px;">${(Array.isArray(entry.tags) ? entry.tags : (entry.tag ? [entry.tag] : [])).map(t => `<span>${t}</span>`).join('')}</div>
        </div>
      </div>
      <div class="contact-sheet" style="margin-left:0; margin-top:56px;">${frames}</div>
    `;

    initLightbox();
    mountSubscribe();

    try { setupMap(entry); } catch (mapErr) { console.error('Map setup failed:', mapErr); }
  }

  try {
    renderEntry();
  } catch (err) {
    document.getElementById('entry-root').innerHTML = `
      <div style="padding:24px; font-family:'IBM Plex Mono', monospace; font-size:13px; color:#d3a24e; border:1px solid #1c3552; border-radius:4px;">
        Couldn't load this entry. Likely a syntax error in entries.js. Check the browser console (F12).<br><br>Error: ${err.message}
      </div>`;
    console.error(err);
  }
</script>

</body>
</html>
